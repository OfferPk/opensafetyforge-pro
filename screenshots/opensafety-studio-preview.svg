<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#141c2e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Grid lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="50" y1="0" x2="50" y2="675" />
    <line x1="200" y1="0" x2="200" y2="675" />
    <line x1="350" y1="0" x2="350" y2="675" />
    <line x1="500" y1="0" x2="500" y2="675" />
    <line x1="650" y1="0" x2="650" y2="675" />
    <line x1="800" y1="0" x2="800" y2="675" />
    <line x1="950" y1="0" x2="950" y2="675" />
    <line x1="1100" y1="0" x2="1100" y2="675" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="0" y1="600" x2="1200" y2="600" />
  </g>

  <!-- Header Banner -->
  <rect x="50" y="40" width="1100" height="80" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <rect x="70" y="55" width="50" height="50" rx="8" fill="#f59e0b" />
  <text x="95" y="87" font-family="system-ui, sans-serif" font-weight="900" font-size="18" fill="#000" text-anchor="middle">o-S</text>
  <text x="140" y="75" font-family="system-ui, sans-serif" font-weight="800" font-size="26" fill="#f8fafc">OpenSafetyForge Pro</text>
  <text x="140" y="100" font-family="system-ui, sans-serif" font-weight="500" font-size="14" fill="#94a3b8">IEC 61784-3-13 / EPSG DS 309 OpenSAFETY Protocol Studio, Dual Sub-Frames &amp; SIL 3 Auditor</text>
  <rect x="990" y="65" width="130" height="30" rx="6" fill="#10b981" opacity="0.2" />
  <text x="1055" y="85" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#34d399" text-anchor="middle">SIL 3 / PL e (Cat 4)</text>

  <!-- Left Card: OpenSAFETY Frame Layout -->
  <rect x="50" y="145" width="530" height="480" rx="10" fill="#151e33" stroke="#334155" stroke-width="1" />
  <rect x="50" y="145" width="530" height="45" rx="10" fill="#1e293b" />
  <text x="75" y="174" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#f8fafc">Symmetrical Dual Sub-Frame Structure</text>
  
  <text x="75" y="220" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Sender S_Addr: <tspan fill="#fbbf24" font-weight="700">2</tspan>  |  Target T_Addr: <tspan fill="#38bdf8" font-weight="700">1</tspan>  |  TS: <tspan fill="#34d399" font-weight="700">100</tspan></text>
  <text x="75" y="245" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Carrier: <tspan fill="#38bdf8" font-weight="800">Ethernet POWERLINK / PROFINET / EtherNet/IP</tspan></text>

  <!-- Frame Layout Graphic -->
  <g transform="translate(75, 275)">
    <!-- Sub-Frame 1 Group -->
    <rect x="0" y="0" width="85" height="60" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="42" y="20" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">T_Addr (2B)</text>
    <text x="42" y="42" font-family="monospace" font-weight="700" font-size="14" fill="#38bdf8" text-anchor="middle">00 01</text>
    <text x="42" y="75" font-family="system-ui, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Target: 1</text>

    <rect x="90" y="0" width="85" height="60" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="132" y="20" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">S_Addr (2B)</text>
    <text x="132" y="42" font-family="monospace" font-weight="700" font-size="14" fill="#38bdf8" text-anchor="middle">00 02</text>
    <text x="132" y="75" font-family="system-ui, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Sender: 2</text>

    <rect x="180" y="0" width="75" height="60" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="217" y="20" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">TS (2B)</text>
    <text x="217" y="42" font-family="monospace" font-weight="700" font-size="14" fill="#38bdf8" text-anchor="middle">00 64</text>
    <text x="217" y="75" font-family="system-ui, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Time: 100</text>

    <rect x="260" y="0" width="75" height="60" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="297" y="20" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Data (2B)</text>
    <text x="297" y="42" font-family="monospace" font-weight="700" font-size="14" fill="#38bdf8" text-anchor="middle">01 00</text>
    <text x="297" y="75" font-family="system-ui, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Safe State</text>

    <rect x="340" y="0" width="95" height="60" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="387" y="20" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">CRC1 (0x5935)</text>
    <text x="387" y="42" font-family="monospace" font-weight="700" font-size="13" fill="#34d399" text-anchor="middle">D8 3A</text>
    <text x="387" y="75" font-family="system-ui, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Sub1 Checksum</text>

    <rect x="440" y="0" width="95" height="60" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="487" y="20" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">CRC2 (0x759B)</text>
    <text x="487" y="42" font-family="monospace" font-weight="700" font-size="13" fill="#34d399" text-anchor="middle">F9 4E</text>
    <text x="487" y="75" font-family="system-ui, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Sub2 Diverse</text>
  </g>

  <!-- Diverse Checksum Callout -->
  <rect x="75" y="385" width="480" height="95" rx="6" fill="#0f172a" stroke="#1e293b" />
  <text x="95" y="415" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#fbbf24">Dual Diverse CRC-16 (IEC 61784-3-13):</text>
  <text x="95" y="438" font-family="monospace" font-size="12" fill="#94a3b8">Sub-Frame 1: 0x5935 | Sub-Frame 2: 0x759B (Diverse)</text>
  <text x="95" y="462" font-family="system-ui, sans-serif" font-size="12" fill="#34d399">Virtual S_Addr Binding | Hamming Distance d ≥ 4 | SIL 3 / PL e</text>

  <!-- Right Card: Timing & ISO 13855 Optical Clearance -->
  <rect x="620" y="145" width="530" height="480" rx="10" fill="#151e33" stroke="#334155" stroke-width="1" />
  <rect x="620" y="145" width="530" height="45" rx="10" fill="#1e293b" />
  <text x="645" y="174" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#f8fafc">Carrier Timing &amp; ISO 13855 Sizer</text>

  <g transform="translate(645, 215)">
    <rect x="0" y="0" width="230" height="80" rx="8" fill="#0f172a" stroke="#1e293b" />
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">POWERLINK Cycle Time</text>
    <text x="20" y="58" font-family="system-ui, sans-serif" font-weight="800" font-size="22" fill="#38bdf8">1.0 ms</text>

    <rect x="250" y="0" width="230" height="80" rx="8" fill="#0f172a" stroke="#1e293b" />
    <text x="270" y="28" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Safety Timeout (3.5x)</text>
    <text x="270" y="58" font-family="system-ui, sans-serif" font-weight="800" font-size="22" fill="#facc15">3.5 ms</text>
  </g>

  <g transform="translate(645, 315)">
    <rect x="0" y="0" width="230" height="80" rx="8" fill="#0f172a" stroke="#1e293b" />
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Total Reaction Time (T_wcrt)</text>
    <text x="20" y="58" font-family="system-ui, sans-serif" font-weight="800" font-size="22" fill="#f87171">28.6 ms</text>

    <rect x="250" y="0" width="230" height="80" rx="8" fill="#0f172a" stroke="#1e293b" />
    <text x="270" y="28" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">ISO 13855 Optical Distance (S)</text>
    <text x="270" y="58" font-family="system-ui, sans-serif" font-weight="800" font-size="22" fill="#34d399">174 mm</text>
  </g>

  <!-- Formula breakdown -->
  <rect x="645" y="415" width="480" height="80" rx="6" fill="#0f172a" stroke="#1e293b" />
  <text x="665" y="445" font-family="monospace" font-size="12" fill="#94a3b8">S = (K × T_wcrt) + C = (1600 mm/s × 0.0286 s) + 128 mm</text>
  <text x="665" y="470" font-family="monospace" font-size="12" fill="#38bdf8">T_wcrt = T_in(3ms) + 2×Cycle(2ms) + Jitter(0.1ms) + Timeout(3.5ms) + T_act(20ms)</text>

  <!-- 10-Point Auditor Status Pill -->
  <rect x="645" y="515" width="480" height="85" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1.5" />
  <text x="670" y="545" font-family="system-ui, sans-serif" font-weight="800" font-size="16" fill="#34d399">✓ 10-POINT SIL 3 AUDIT: ALL CHECKS PASSED</text>
  <text x="670" y="575" font-family="system-ui, sans-serif" font-size="13" fill="#a7f3d0">S_Addr 1..1023 • Symmetrical Sub-Frames • Diverse CRCs • SCT ≥ 3.0x • Monitored Reset</text>
</svg>
